<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live Game Overlay</title>
<style>
  html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; }
  body { display: flex; align-items: flex-start; justify-content: center; }
  .stage { position: relative; width: min(100vw, 56.25vh); aspect-ratio: 9 / 16; }
  .stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #scene3d { display: none; }
  #hud {
    position: absolute; inset: 0; display: none;
    font-family: system-ui, sans-serif; color: #fff;
    pointer-events: none;
  }
  #meter {
    position: absolute; top: 33.2%; left: 6.5%; right: 6.5%; height: 1.35%;
    background: rgba(10, 18, 30, 0.6); border-radius: 13px; overflow: hidden;
  }
  #meter-fill { height: 100%; width: 0%; background: #ffd97a; border-radius: 13px; }
  #howto {
    position: absolute; top: 36.8%; left: 7%; right: 7%;
    background: rgba(12, 24, 38, 0.72); border-radius: 14px; padding: 10px 14px;
  }
  #howto h2 { margin: 0 0 6px; font-size: 20px; font-weight: 700; letter-spacing: 0.04em; }
  #howto-list { list-style: none; margin: 0; padding: 0; }
  #howto-list li { display: flex; align-items: center; gap: 10px; padding: 2px 0; font-size: 20px; line-height: 1.5; }
  .howto-icon { flex: none; width: 22px; height: 22px; color: #ffd97a; display: inline-flex; }
  .howto-icon svg { width: 22px; height: 22px; }
  #ticker {
    position: absolute; top: 81%; left: 7%; right: 7%; display: none;
    text-align: center; font-size: 22px; font-weight: 600;
    background: rgba(12, 24, 38, 0.66); border-radius: 20px; padding: 6px 12px;
  }
  #toast {
    position: absolute; top: 52%; left: 50%; transform: translateX(-50%); display: none;
    background: rgba(12, 24, 38, 0.78); border-radius: 22px; padding: 8px 18px;
    font-size: 24px; font-weight: 600; white-space: nowrap;
  }
  #state-notice {
    position: absolute; top: 46%; left: 50%; transform: translateX(-50%); display: none;
    background: rgba(10, 18, 30, 0.75); border-radius: 22px; padding: 8px 18px;
    font-size: 24px; font-weight: 600; white-space: nowrap;
  }
  #footer {
    position: absolute; left: 4.6%; right: 4.6%; bottom: 0.5%;
    background: rgba(12, 24, 38, 0.72); border-radius: 16px; padding: 12px 16px;
    font-size: 17px; line-height: 1.45;
  }
  #footer p { margin: 4px 0; }
  @media (prefers-reduced-motion: reduce) {
    #meter-fill { transition: none; }
  }
</style>
</head>
<body>
<div class="stage">
  <canvas id="scene" width="1080" height="1920" aria-label="Interactive live game scene"></canvas>
  <canvas id="scene3d" width="1080" height="1920" aria-label="Sunrise Lake in 3D"></canvas>
  <div id="hud">
    <div id="meter" role="meter" aria-label="Tide meter"><div id="meter-fill"></div></div>
    <section id="howto" aria-label="How to play">
      <h2>How to play</h2>
      <ul id="howto-list"></ul>
    </section>
    <div id="ticker" aria-live="polite"></div>
    <div id="toast"></div>
    <div id="state-notice"></div>
    <div id="footer"></div>
  </div>
</div>
<noscript><p style="color:#fff;font-family:system-ui">This overlay needs JavaScript.</p></noscript>
<script type="module" src="./overlay.js"></script>
</body>
</html>
